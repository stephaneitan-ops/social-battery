name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'appli et le cadran
        run: |
          set -o pipefail
          gradle :app:assembleDebug :watchface:assembleDebug 2>&1 | tee build.log || {
            msg=$(grep -E -A6 "^e: |error:|What went wrong" build.log | grep -v "^> Task" | head -40 | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          }

      - name: Renommer les APK
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/SocialBattery-app.apk
          cp watchface/build/outputs/apk/debug/watchface-debug.apk out/SocialBattery-cadran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publier en téléchargement direct (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.apk --title "Dernière version" --notes "APK prêts à installer : appli + cadran."
