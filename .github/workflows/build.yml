name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'appli et le cadran
        run: |
          set -o pipefail
          gradle :app:assembleDebug :watchface:assembleDebug 2>&1 | tee build.log || {
            msg=$(grep -E -A6 "^e: |error:|What went wrong" build.log | grep -v "^> Task" | head -40 | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          }

      - name: Valider le cadran (validateur officiel Google)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R google/watchface --pattern "wff-validator.jar" -D wff
          java -jar wff/wff-validator.jar 1 watchface/src/main/res/raw/watchface.xml 2>&1 | tee wff.log
          if ! grep -q "PASSED" wff.log; then
            msg=$(grep SEVERE wff.log | head -20 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Cadran invalide%0A$msg"
            exit 1
          fi

      - name: Analyse mode repos (AOD) du cadran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R google/watchface --pattern "memory-footprint.jar" -D wff
          apk=watchface/build/outputs/apk/debug/watchface-debug.apk
          { java -jar wff/memory-footprint.jar --watch-face $apk --schema-version 1 --apply-v1-offload-limitations --verbose 2>&1 | tail -30; } > mem.log || true
          msg=$(cut -c1-250 mem.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=WFF::$msg"

      - name: Renommer les APK
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/SocialBattery-app.apk
          cp watchface/build/outputs/apk/debug/watchface-debug.apk out/SocialBattery-cadran.apk

      - name: Créer l'installateur Windows (zip)
        run: |
          mkdir -p pkg/SocialBattery-Installateur
          cp out/*.apk installer/Installer.ps1 pkg/SocialBattery-Installateur/
          sed 's/$/\r/' installer/Installer.bat > pkg/SocialBattery-Installateur/Installer.bat
          sed 's/$/\r/' installer/Diagnostic.bat > pkg/SocialBattery-Installateur/Diagnostic.bat
          sed -i 's/$/\r/' pkg/SocialBattery-Installateur/Installer.ps1
          (cd pkg && zip -r ../out/SocialBattery-Installateur-Windows.zip SocialBattery-Installateur)

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: Publier en téléchargement direct (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/* --title "Dernière version" --notes "Sur PC Windows : télécharge SocialBattery-Installateur-Windows.zip, décompresse-le, double-clic sur Installer.bat."
